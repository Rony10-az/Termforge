[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termforge"
version = "0.1.0"
description = "CLI para diagnosticar, respaldar y configurar tu terminal de Windows (Windows Terminal, PowerShell 7, Oh My Posh)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rony", email = "ronnjhost@gmail.com" }]
keywords = ["windows", "terminal", "powershell", "oh-my-posh", "dotfiles", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Rony10-az/Termforge"
Repository = "https://github.com/Rony10-az/Termforge"
Issues = "https://github.com/Rony10-az/Termforge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
termforge = "termforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/termforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
