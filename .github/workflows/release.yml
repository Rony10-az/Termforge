name: Release

on:
  release:
    types: [published]

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # necesario para Trusted Publishing (sin tokens/secrets)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir sdist y wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write # para adjuntar el .exe al release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar termforge y PyInstaller
        run: python -m pip install -e . pyinstaller
      - name: Construir termforge.exe
        run: pyinstaller termforge.spec
      - name: Adjuntar al release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/termforge.exe --clobber
